<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader - Manga Translator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>Reader</h1>
    <div class="sub" id="batch-label">loading batch...</div>
  </div>
  <div class="actions" style="margin:0">
    <div class="mode-switch" id="mode-switch">
      <button data-mode="single" class="active">Single page</button>
      <button data-mode="strip">Long strip</button>
      <button data-mode="fullscreen">Fullscreen</button>
    </div>
    <button class="secondary" id="back">Back to upload</button>
    <button class="secondary" id="download">Download zip</button>
  </div>
</header>

<main>
  <div id="banner" class="banner hidden"></div>

  <div class="thumb-rail hidden" id="thumb-rail"></div>

  <div class="reader-wrap" id="single-view">
    <div>
      <div class="page-stage" id="stage">
        <div class="sub" id="stage-message">no page loaded</div>
        <div class="click-zone left" id="zone-left" title="previous page"></div>
        <div class="click-zone right" id="zone-right" title="next page"></div>
      </div>
      <div class="nav">
        <button class="secondary" id="prev">Previous</button>
        <div class="counter" id="counter">- / -</div>
        <button class="secondary" id="next">Next</button>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Regions</h2>
        <div class="sub" id="region-summary">-</div>
        <div class="regions" id="regions"></div>
      </div>
    </div>
  </div>

  <div class="strip-wrap hidden" id="strip-view"></div>
</main>

<div class="reader-fullscreen hidden" id="fullscreen-view">
  <button class="secondary fs-exit" id="fs-exit">Exit fullscreen</button>
  <div class="click-zone left" id="fs-zone-left"></div>
  <div class="click-zone right" id="fs-zone-right"></div>
  <img id="fs-image" alt="">
  <div class="fs-counter" id="fs-counter">- / -</div>
</div>

<script src="app.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const batchId = params.get("batch");

const banner = document.getElementById("banner");
const stage = document.getElementById("stage");
const stageMessage = document.getElementById("stage-message");
const counter = document.getElementById("counter");
const regionsEl = document.getElementById("regions");
const regionSummary = document.getElementById("region-summary");
const batchLabel = document.getElementById("batch-label");
const prevButton = document.getElementById("prev");
const nextButton = document.getElementById("next");
const thumbRail = document.getElementById("thumb-rail");
const singleView = document.getElementById("single-view");
const stripView = document.getElementById("strip-view");
const fullscreenView = document.getElementById("fullscreen-view");
const fsImage = document.getElementById("fs-image");
const fsCounter = document.getElementById("fs-counter");
const modeSwitch = document.getElementById("mode-switch");

let readablePages = [];
let position = 0;
let mode = "single";
const pageCache = new Map();

function showBanner(kind, message) {
  banner.className = "banner " + kind;
  banner.textContent = message;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

document.getElementById("back").addEventListener("click", function () {
  const api = params.get("api");
  window.location.href = "index.html" + (api ? "?api=" + encodeURIComponent(api) : "");
});

document.getElementById("download").addEventListener("click", function () {
  if (batchId) window.location.href = batchDownloadUrl(batchId);
});

prevButton.addEventListener("click", function () { move(-1); });
nextButton.addEventListener("click", function () { move(1); });
document.getElementById("zone-left").addEventListener("click", function () { move(-1); });
document.getElementById("zone-right").addEventListener("click", function () { move(1); });
document.getElementById("fs-zone-left").addEventListener("click", function () { move(-1); });
document.getElementById("fs-zone-right").addEventListener("click", function () { move(1); });
document.getElementById("fs-exit").addEventListener("click", function () { setMode("single"); });

document.addEventListener("keydown", function (event) {
  if (mode === "fullscreen" && event.key === "Escape") { setMode("single"); return; }
  if (mode === "strip") return; // arrow keys scroll the page naturally in strip mode
  if (event.key === "ArrowLeft") move(-1);
  if (event.key === "ArrowRight") move(1);
});

modeSwitch.addEventListener("click", function (event) {
  const button = event.target.closest("button[data-mode]");
  if (button) setMode(button.dataset.mode);
});

function setMode(next) {
  mode = next;
  for (const button of modeSwitch.querySelectorAll("button")) {
    button.classList.toggle("active", button.dataset.mode === next);
  }
  singleView.classList.toggle("hidden", next !== "single");
  stripView.classList.toggle("hidden", next !== "strip");
  fullscreenView.classList.toggle("hidden", next !== "fullscreen");
  thumbRail.classList.toggle("hidden", next === "fullscreen" || readablePages.length === 0);

  if (next === "strip") {
    renderStrip();
  } else if (next === "fullscreen") {
    showFullscreenPage();
  } else {
    showPage();
  }
}

function move(delta) {
  const next = position + delta;
  if (next < 0 || next >= readablePages.length) return;
  position = next;
  if (mode === "fullscreen") {
    showFullscreenPage();
  } else {
    showPage();
  }
}

function jumpTo(index) {
  if (index < 0 || index >= readablePages.length) return;
  position = index;
  if (mode === "strip") {
    const el = document.getElementById("strip-page-" + index);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  } else if (mode === "fullscreen") {
    showFullscreenPage();
  } else {
    showPage();
  }
  renderThumbRail();
}

async function loadPage(index) {
  const page = readablePages[index];
  let detail = pageCache.get(page.index);
  if (!detail) {
    detail = await getBatchPage(batchId, page.index);
    pageCache.set(page.index, detail);
  }
  return detail;
}

async function showPage() {
  counter.textContent = (position + 1) + " / " + readablePages.length;
  prevButton.disabled = position === 0;
  nextButton.disabled = position >= readablePages.length - 1;

  let detail;
  try {
    stageMessage.textContent = "loading page " + (position + 1) + "...";
    detail = await loadPage(position);
  } catch (err) {
    showBanner("error", "Could not load page " + (position + 1) + ": " + err.message);
    return;
  }

  const existingImg = stage.querySelector("img");
  if (existingImg) existingImg.remove();
  stageMessage.classList.add("hidden");

  const img = document.createElement("img");
  img.alt = detail.filename;
  img.src = resolveImageUrl(detail.image_url);
  img.addEventListener("error", function () {
    stageMessage.textContent = "image failed to load";
    stageMessage.classList.remove("hidden");
  });
  stage.insertBefore(img, stage.firstChild);

  renderRegions(detail);
  renderThumbRail();
  prefetch(position + 1);
}

async function showFullscreenPage() {
  fsCounter.textContent = (position + 1) + " / " + readablePages.length;
  try {
    const detail = await loadPage(position);
    fsImage.src = resolveImageUrl(detail.image_url);
    fsImage.alt = detail.filename;
  } catch (err) {
    showBanner("error", "Could not load page " + (position + 1) + ": " + err.message);
  }
  prefetch(position + 1);
}

function renderRegions(detail) {
  const regions = detail.regions || [];
  regionSummary.textContent =
    detail.filename + " - " + regions.length + (regions.length === 1 ? " region" : " regions") +
    (detail.duration_seconds != null ? " - " + detail.duration_seconds + "s" : "");

  regionsEl.innerHTML = "";
  if (regions.length === 0) {
    regionsEl.innerHTML = '<div class="sub">no text regions detected on this page</div>';
    return;
  }
  regions.forEach(function (region, i) {
    const box = document.createElement("div");
    box.className = "region";
    const bounds = region.bounds || [0, 0, 0, 0];
    box.innerHTML =
      '<div class="src">' + (i + 1) + ". " + escapeHtml(region.source_text || "(empty)") + "</div>" +
      '<div class="dst">' + escapeHtml(region.translation || "(not translated)") + "</div>" +
      '<div class="bounds">[' + bounds.join(", ") + "]</div>";
    regionsEl.appendChild(box);
  });
}

function renderThumbRail() {
  // the rail's own visibility is decided here, not only in setMode(), since
  // init() renders the first page directly without going through setMode()
  thumbRail.classList.toggle("hidden", mode === "fullscreen" || readablePages.length === 0);
  if (readablePages.length === 0) return;
  thumbRail.innerHTML = "";
  readablePages.forEach(function (page, i) {
    const thumb = document.createElement("div");
    thumb.className = "thumb" + (i === position ? " current" : "");
    thumb.innerHTML = "<span>" + (i + 1) + "</span>";
    thumb.title = page.filename;
    thumb.addEventListener("click", function () { jumpTo(i); });

    const cached = pageCache.get(page.index);
    if (cached) {
      thumb.style.backgroundImage = "url(" + resolveImageUrl(cached.image_url) + ")";
    } else {
      thumb.classList.add("pending");
      loadPage(i).then(function (detail) {
        thumb.style.backgroundImage = "url(" + resolveImageUrl(detail.image_url) + ")";
        thumb.classList.remove("pending");
      }).catch(function () { /* thumbnail stays as a number-only placeholder */ });
    }
    thumbRail.appendChild(thumb);
  });
}

// long-strip mode: every page stacked vertically, each image loaded lazily
// via IntersectionObserver as it scrolls near the viewport, not all at once
let stripObserver = null;

function renderStrip() {
  stripView.innerHTML = "";
  if (stripObserver) stripObserver.disconnect();

  readablePages.forEach(function (page, i) {
    const wrap = document.createElement("div");
    wrap.className = "strip-page";
    wrap.id = "strip-page-" + i;
    wrap.dataset.index = i;
    wrap.textContent = "page " + (i + 1) + "...";
    stripView.appendChild(wrap);
  });

  stripObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      const index = Number(el.dataset.index);
      stripObserver.unobserve(el);
      loadPage(index).then(function (detail) {
        el.textContent = "";
        const img = document.createElement("img");
        img.alt = detail.filename;
        img.src = resolveImageUrl(detail.image_url);
        el.appendChild(img);
        if (index === position) return;
        // update the "current page" marker as the user scrolls, so the
        // thumbnail rail and jump-to-page stay in sync with what is on screen
      }).catch(function () {
        el.textContent = "page " + (index + 1) + " failed to load";
      });
    });
  }, { root: null, rootMargin: "600px 0px", threshold: 0.01 });

  document.querySelectorAll(".strip-page").forEach(function (el) {
    stripObserver.observe(el);
  });

  // track which page is most in view, for the thumbnail rail's highlight
  const positionObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
        position = Number(entry.target.dataset.index);
        renderThumbRail();
      }
    });
  }, { root: null, threshold: 0.5 });
  document.querySelectorAll(".strip-page").forEach(function (el) {
    positionObserver.observe(el);
  });
}

async function prefetch(index) {
  const page = readablePages[index];
  if (!page || pageCache.has(page.index)) return;
  try {
    const detail = await getBatchPage(batchId, page.index);
    pageCache.set(page.index, detail);
    const img = new Image();
    img.src = resolveImageUrl(detail.image_url);
  } catch (err) {
    // prefetch is best effort; a failure here is retried on navigation
  }
}

(async function init() {
  if (!batchId) {
    showBanner("error", "No batch specified. Open the reader from the upload page.");
    batchLabel.textContent = "no batch";
    return;
  }

  let batch;
  try {
    batch = await getBatch(batchId);
  } catch (err) {
    showBanner("error", "Could not load batch: " + err.message);
    batchLabel.textContent = "batch unavailable";
    return;
  }

  batchLabel.textContent =
    "batch " + batch.batch_id.slice(0, 8) + " - " + batch.source_lang +
    " - " + batch.completed + " of " + batch.total + " pages ready";

  readablePages = batch.pages.filter(function (p) { return p.status === "done"; });

  if (readablePages.length === 0) {
    showBanner("warn", "No pages have finished translating yet.");
    stageMessage.textContent = "nothing to read";
    prevButton.disabled = true;
    nextButton.disabled = true;
    return;
  }

  if (batch.failed > 0) {
    showBanner("warn", batch.failed + " page(s) failed and are not shown.");
  }

  position = 0;
  showPage();
})();
</script>
</body>
</html>
